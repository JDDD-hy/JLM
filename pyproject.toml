[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jlm"
version = "0.1.0"
description = "Jiahao Language Model: reproducible Chinese quote-style QLoRA pipeline"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.tmp/pytest"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

